{% extends "base.html" %}
{% load static %}
{% block title %}Reset Password{% endblock %}

{% block main %}
<div class="breadcrumb-area">
    <div class="top-breadcrumb-area bg-img bg-overlay d-flex align-items-center justify-content-center" style="background-image: url('{% static "img/bg-img/24.jpg" %}');">
        <h2>Reset Password</h2>
    </div>
</div>

<section class="contact-area section-padding-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="contact-form">
                    <h5 class="mb-4 text-center">Forgot Your Password?</h5>
                    <p class="text-center mb-4">Enter your email address below, and we'll email instructions for setting a new one.</p>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="id_email">Email Address</label>
                            <input type="email" name="email" class="form-control" required id="id_email" placeholder="your.email@example.com">
                        </div>
                        <button type="submit" class="btn alazea-btn w-100 mt-15">Send Reset Link</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
